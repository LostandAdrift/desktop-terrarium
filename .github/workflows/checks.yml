name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-view-and-model:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Install the native test runtime
        run: pacman -Syu --noconfirm --needed git nodejs python qt6-declarative qt6-svg ttf-liberation quickshell
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the collector and state model
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.cjs
      - name: Test the real QtQuick view without a desktop
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: ""
          QT_STYLE_OVERRIDE: Fusion
          QT_QUICK_BACKEND: software
          QT_FORCE_STDERR_LOGGING: "1"
        run: /usr/lib/qt6/bin/qmltestrunner -input tests -o -,txt
      - name: Test shared observer shutdown and recovery without windows
        run: bash scripts/check-store.sh
      - name: Test postcard pixel dimensions on fractional and high-DPI displays
        run: bash scripts/check-postcard-scale.sh
      - name: Test lock, display, clock changes and rapid observer transitions
        run: bash scripts/check-store.sh NativeLifecycle
      - name: Test postcard helper ownership, cancellation and recovery
        run: bash scripts/check-postcard.sh
